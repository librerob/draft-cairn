name: Validate and package
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated manifest version as a preview release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check.mjs
      - run: python3 scripts/check-assets.py
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: |
          python3 scripts/package.py
          cp dist/SHA256SUMS /tmp/first-checksum
          python3 scripts/package.py
          cmp dist/SHA256SUMS /tmp/first-checksum
          cd dist && sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-release
          path: |
            dist/
            test-results/browser-summary.json
            test-results/screenshots/*.png
          retention-days: 14
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/package.py
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./extension/manifest.json').version")"
          gh release create "v$version" "dist/draft-cairn-$version.zip" "dist/draft-cairn-store-kit-$version.zip" dist/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title "Draft Cairn $version · preview" --notes-file docs/release-notes.md
