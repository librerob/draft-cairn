name: Public portal compatibility
on:
  workflow_dispatch:
  push:
    branches: [feat/paste-verification]
permissions:
  contents: read
jobs:
  public-samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: node tests/portals.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-portal-results
          path: test-results/portals/
          retention-days: 14
